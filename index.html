<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kalender PWA</title>
  <meta name="description" content="Kalender pribadi dengan notifikasi, event, dan tampilan elegan" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kalender" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.10);
      --border: rgba(255,255,255,0.08);
      --text: #f0ece4;
      --text-muted: rgba(240,236,228,0.45);
      --accent: #e8c97a;
      --accent-dim: rgba(232,201,122,0.15);
      --accent2: #7ab8e8;
      --danger: #e87a7a;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 8px 40px rgba(0,0,0,0.6);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;

      /* event type colors */
      --c-general: #7ab8e8;
      --c-birthday: #e87ac0;
      --c-bill: #e8c97a;
      --c-holiday: #7ae8a4;
      --c-meeting: #c07ae8;
      --c-reminder: #e8937a;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ===== BACKGROUND ===== */
    #bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg);
      transition: background 0.5s ease;
    }
    #bg-layer.has-image {
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    #bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(10,10,20,0.72);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    /* ===== NOTIF BANNER ===== */
    .notif-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--accent);
      color: #1a1400;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      font-size: 0.85rem; font-weight: 600;
      animation: slideDown 0.3s ease;
      min-height: 44px;
    }
    .notif-banner.hidden { display: none; }
    .notif-banner button { 
      background: none; border: none; cursor: pointer; 
      font-size: 1.2rem; padding: 8px;
      min-width: 44px; min-height: 44px;
    }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

    /* ===== HEADER ===== */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(15,15,26,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      min-height: 60px;
      gap: 8px;
    }
    .header-left, .header-right {
      display: flex; align-items: center; gap: 4px;
    }
    .header-left { flex: 1; min-width: 0; }
    .header-right { flex-shrink: 0; }

    .month-title {
      font-family: var(--font-display);
      font-size: clamp(1rem, 4vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      min-width: 120px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      width: 40px; height: 40px; min-width: 40px;
      cursor: pointer;
      font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn:hover { background: var(--surface-hover); border-color: var(--accent); color: var(--accent); }

    .today-btn, .add-event-btn {
      background: var(--accent-dim); border: 1px solid var(--accent);
      color: var(--accent); border-radius: var(--radius-sm);
      padding: 6px 12px; cursor: pointer; font-size: 0.8rem;
      font-family: var(--font-body); font-weight: 600;
      transition: all 0.2s; white-space: nowrap;
      min-height: 40px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .today-btn:active, .add-event-btn:active { transform: scale(0.96); }
    .today-btn:hover, .add-event-btn:hover { background: var(--accent); color: #1a1400; }

    /* ===== TODAY STRIP ===== */
    .today-strip {
      position: relative; z-index: 10;
      background: rgba(232,201,122,0.08);
      border-bottom: 1px solid rgba(232,201,122,0.2);
      padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap;
    }
    .today-strip.hidden { display: none; }
    .today-strip-label { 
      font-size: 0.75rem; font-weight: 600; color: var(--accent); 
      white-space: nowrap;
    }
    .today-events-list { 
      display: flex; gap: 6px; flex-wrap: wrap; 
      flex: 1;
    }
    .today-chip {
      font-size: 0.7rem; padding: 3px 8px;
      border-radius: 20px; font-weight: 500;
      background: var(--surface); border: 1px solid var(--border);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== CALENDAR MAIN ===== */
    .calendar-main {
      position: relative; z-index: 10;
      padding: 0 8px 16px;
      max-width: 1400px; margin: 0 auto;
    }
    .weekday-labels {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 8px 0 4px;
      text-align: center;
    }
    .weekday-labels span {
      font-size: clamp(0.6rem, 1.5vw, 0.72rem);
      font-weight: 600; letter-spacing: 0.08em;
      color: var(--text-muted); text-transform: uppercase;
    }
    .weekday-labels span:first-child { color: var(--danger); opacity: 0.7; }
    .weekday-labels span:last-child { color: var(--accent2); opacity: 0.7; }

    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    /* ===== DAY CELL ===== */
    .day-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-height: 80px;
      padding: 4px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }
    .day-cell:active { transform: scale(0.97); }
    .day-cell:hover { background: var(--surface-hover); border-color: rgba(255,255,255,0.18); }
    .day-cell.other-month { opacity: 0.25; }
    .day-cell.today {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .day-cell.today .day-num {
      background: var(--accent);
      color: #1a1400;
      border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .day-cell.sunday .day-num { color: var(--danger); }
    .day-cell.saturday .day-num { color: var(--accent2); }

    .day-num {
      font-size: clamp(0.7rem, 1.8vw, 0.82rem);
      font-weight: 600;
      margin-bottom: 2px; line-height: 1;
      display: inline-block;
    }

    .event-dot-list { 
      display: flex; 
      flex-direction: column; 
      gap: 1px;
      overflow: hidden;
    }
    .event-dot {
      font-size: clamp(0.55rem, 1.2vw, 0.68rem);
      padding: 1px 4px;
      border-radius: 3px; 
      white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      font-weight: 500; line-height: 1.3;
      border-left: 2px solid;
      min-height: 16px;
    }
    .event-dot.general   { color: var(--c-general); border-color: var(--c-general); background: rgba(122,184,232,0.12); }
    .event-dot.birthday  { color: var(--c-birthday); border-color: var(--c-birthday); background: rgba(232,122,192,0.12); }
    .event-dot.bill      { color: var(--c-bill); border-color: var(--c-bill); background: rgba(232,201,122,0.12); }
    .event-dot.holiday   { color: var(--c-holiday); border-color: var(--c-holiday); background: rgba(122,232,164,0.12); }
    .event-dot.meeting   { color: var(--c-meeting); border-color: var(--c-meeting); background: rgba(192,122,232,0.12); }
    .event-dot.reminder  { color: var(--c-reminder); border-color: var(--c-reminder); background: rgba(232,147,122,0.12); }

    .more-events {
      font-size: clamp(0.55rem, 1.2vw, 0.65rem); 
      color: var(--text-muted); 
      margin-top: 1px;
    }

    /* ===== MODALS ===== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    .modal-backdrop.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: #181828;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%; max-width: 480px;
      box-shadow: var(--shadow);
      animation: slideUp 0.25s ease;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-sm { max-width: 380px; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 3vw, 1.25rem);
      font-weight: 700;
    }
    .modal-body {
      padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-body label {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .modal-body input, .modal-body select, .modal-body textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: var(--font-body);
      width: 100%;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    .modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .modal-body select option { background: #181828; }
    .modal-body textarea { resize: vertical; }

    .modal-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      gap: 8px;
    }
    .modal-footer-right { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-primary {
      background: var(--accent); color: #1a1400;
      border: none; border-radius: var(--radius-sm);
      padding: 10px 20px; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; font-family: var(--font-body);
      transition: all 0.2s;
      min-height: 44px;
      touch-action: manipulation;
    }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:hover { background: #f0d990; }

    .btn-secondary {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 20px; font-weight: 500; font-size: 0.85rem;
      cursor: pointer; font-family: var(--font-body);
      transition: all 0.2s;
      min-height: 44px;
      touch-action: manipulation;
    }
    .btn-secondary:active { transform: scale(0.96); }
    .btn-secondary:hover { background: var(--surface-hover); }

    .btn-danger {
      background: rgba(232,122,122,0.12); color: var(--danger);
      border: 1px solid var(--danger); border-radius: var(--radius-sm);
      padding: 10px 20px; font-weight: 500; font-size: 0.85rem;
      cursor: pointer; font-family: var(--font-body);
      transition: all 0.2s;
      min-height: 44px;
      touch-action: manipulation;
    }
    .btn-danger:active { transform: scale(0.96); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-danger.hidden { display: none; }
    .full-width { width: 100%; margin-top: 4px; }

    /* ===== GRADIENT PICKER ===== */
    .gradient-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .gradient-swatch {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      cursor: pointer; border: 2px solid transparent;
      transition: all 0.2s;
      min-width: 40px;
      touch-action: manipulation;
    }
    .gradient-swatch:active { transform: scale(0.92); }
    .gradient-swatch:hover, .gradient-swatch.selected {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    /* ===== DAY PANEL ===== */
    .day-panel {
      position: fixed; right: 0; top: 0; bottom: 0;
      width: min(90vw, 320px);
      z-index: 200;
      background: #12121f;
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 40px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      animation: slideInRight 0.25s ease;
    }
    .day-panel.hidden { display: none; }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

    .day-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .day-panel-header h3 {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.5vw, 1.1rem);
    }
    .day-panel-events { flex: 1; overflow-y: auto; padding: 10px; }
    .day-event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid;
      touch-action: manipulation;
    }
    .day-event-card:active { transform: scale(0.98); }
    .day-event-card:hover { background: var(--surface-hover); }
    .day-event-card.general  { border-left-color: var(--c-general); }
    .day-event-card.birthday { border-left-color: var(--c-birthday); }
    .day-event-card.bill     { border-left-color: var(--c-bill); }
    .day-event-card.holiday  { border-left-color: var(--c-holiday); }
    .day-event-card.meeting  { border-left-color: var(--c-meeting); }
    .day-event-card.reminder { border-left-color: var(--c-reminder); }

    .day-event-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; }
    .day-event-meta  { font-size: 0.7rem; color: var(--text-muted); }
    .day-event-notes { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-style: italic; }
    .day-panel-empty { text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 0.85rem; }
    .day-panel-add {
      margin: 10px; width: calc(100% - 20px);
      justify-content: center;
      min-height: 44px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .app-header { padding: 10px 12px; }
      .month-title { min-width: 100px; }
      .day-cell { min-height: 70px; padding: 3px; }
      .modal { max-width: 100%; margin: 0; border-radius: var(--radius) var(--radius) 0 0; }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .today-strip { padding: 6px 10px; }
    }

    @media (max-width: 480px) {
      .app-header { 
        padding: 8px 8px; 
        flex-wrap: wrap;
        min-height: 50px;
      }
      .header-left { gap: 2px; }
      .header-right { gap: 2px; }
      .month-title { 
        font-size: clamp(0.8rem, 3.5vw, 1rem); 
        min-width: 80px; 
        max-width: 100px;
      }
      .icon-btn { 
        width: 34px; height: 34px; min-width: 34px;
        font-size: 0.9rem;
      }
      .today-btn { display: none; }
      .add-event-btn { 
        font-size: 0.7rem; 
        padding: 4px 8px;
        min-height: 34px;
      }
      .calendar-main { padding: 0 4px 10px; }
      .day-cell { 
        min-height: 52px; 
        border-radius: 4px;
        padding: 2px;
      }
      .day-num { font-size: clamp(0.6rem, 2vw, 0.7rem); }
      .event-dot { 
        font-size: clamp(0.45rem, 1.5vw, 0.55rem);
        padding: 0 2px;
        min-height: 12px;
        border-left-width: 1px;
      }
      .event-dot-list { gap: 0px; }
      .weekday-labels { padding: 4px 0 2px; }
      .weekday-labels span { font-size: clamp(0.5rem, 1.2vw, 0.6rem); }
      .calendar-grid { gap: 2px; }
      .day-panel { width: 100%; }
      .modal-body { padding: 12px 14px; }
      .modal-footer { padding: 10px 14px 14px; }
      .btn-primary, .btn-secondary, .btn-danger { 
        font-size: 0.75rem; 
        padding: 8px 14px;
        min-height: 36px;
      }
    }

    @media (max-width: 360px) {
      .month-title { 
        font-size: 0.7rem; 
        min-width: 60px;
        max-width: 70px;
      }
      .icon-btn { 
        width: 30px; height: 30px; min-width: 30px;
        font-size: 0.8rem;
      }
      .day-cell { min-height: 44px; }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }

    /* ===== UTILITY ===== */
    .hidden { display: none !important; }

    /* ===== TOUCH IMPROVEMENTS ===== */
    @media (hover: none) {
      .icon-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text); }
      .today-btn:hover, .add-event-btn:hover { background: var(--accent-dim); color: var(--accent); }
      .day-cell:hover { background: var(--surface); border-color: var(--border); }
      .btn-primary:hover { background: var(--accent); }
      .btn-secondary:hover { background: var(--surface); }
      .btn-danger:hover { background: rgba(232,122,122,0.12); color: var(--danger); }
      .day-event-card:hover { background: var(--surface); }
    }

    /* ===== PREFERS REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Background overlay -->
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <!-- Notification banner -->
  <div id="notif-banner" class="notif-banner hidden">
    <span id="notif-text"></span>
    <button id="notif-close">✕</button>
  </div>

  <!-- Sidebar / Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn" id="btn-prev" title="Bulan sebelumnya">‹</button>
      <h1 class="month-title" id="month-title">Januari 2025</h1>
      <button class="icon-btn" id="btn-next" title="Bulan berikutnya">›</button>
      <button class="today-btn" id="btn-today">Hari Ini</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btn-notif" title="Aktifkan notifikasi">🔔</button>
      <button class="icon-btn" id="btn-bg" title="Ganti background">🖼️</button>
      <button class="add-event-btn" id="btn-add">+ Event</button>
    </div>
  </header>

  <!-- Today's events strip -->
  <div id="today-strip" class="today-strip hidden">
    <span class="today-strip-label">📅 Hari Ini:</span>
    <div id="today-events-list" class="today-events-list"></div>
  </div>

  <!-- Calendar Grid -->
  <main class="calendar-main">
    <div class="weekday-labels">
      <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span>
      <span>Kam</span><span>Jum</span><span>Sab</span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </main>

  <!-- Modal: Add/Edit Event -->
  <div class="modal-backdrop hidden" id="event-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Tambah Event</h2>
        <button class="icon-btn modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <label>Judul Event
          <input type="text" id="ev-title" placeholder="Nama event..." maxlength="60" />
        </label>
        <label>Tanggal
          <input type="date" id="ev-date" />
        </label>
        <label>Tipe
          <select id="ev-type">
            <option value="general">📌 Umum</option>
            <option value="birthday">🎂 Ulang Tahun</option>
            <option value="bill">💸 Tagihan</option>
            <option value="holiday">🌴 Liburan</option>
            <option value="meeting">🤝 Meeting</option>
            <option value="reminder">⏰ Pengingat</option>
          </select>
        </label>
        <label>Pengulangan
          <select id="ev-repeat">
            <option value="none">Tidak diulang</option>
            <option value="monthly">Setiap Bulan</option>
            <option value="yearly">Setiap Tahun</option>
          </select>
        </label>
        <label>Catatan
          <textarea id="ev-notes" placeholder="Catatan tambahan..." rows="3"></textarea>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-danger hidden" id="btn-delete">Hapus</button>
        <div class="modal-footer-right">
          <button class="btn-secondary" id="btn-cancel">Batal</button>
          <button class="btn-primary" id="btn-save">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Background picker -->
  <div class="modal-backdrop hidden" id="bg-modal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Ganti Background</h2>
        <button class="icon-btn modal-close" id="bg-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <label>Upload gambar dari HP/PC
          <input type="file" id="bg-file" accept="image/*" />
        </label>
        <label>Atau masukkan URL gambar
          <input type="text" id="bg-url" placeholder="https://..." />
        </label>
        <label>Atau pilih gradien
          <div class="gradient-picker">
            <div class="gradient-swatch" data-gradient="linear-gradient(135deg,#0f0f1a,#1a1a3e)" style="background:linear-gradient(135deg,#0f0f1a,#1a1a3e)"></div>
            <div class="gradient-swatch" data-gradient="linear-gradient(135deg,#0d1b2a,#1b4332)" style="background:linear-gradient(135deg,#0d1b2a,#1b4332)"></div>
            <div class="gradient-swatch" data-gradient="linear-gradient(135deg,#1a0a2e,#3d1a6e)" style="background:linear-gradient(135deg,#1a0a2e,#3d1a6e)"></div>
            <div class="gradient-swatch" data-gradient="linear-gradient(135deg,#0a1628,#c0392b)" style="background:linear-gradient(135deg,#0a1628,#c0392b)"></div>
            <div class="gradient-swatch" data-gradient="linear-gradient(135deg,#1a1200,#3d2b00)" style="background:linear-gradient(135deg,#1a1200,#3d2b00)"></div>
            <div class="gradient-swatch" data-gradient="linear-gradient(135deg,#0f1923,#1e3a5f)" style="background:linear-gradient(135deg,#0f1923,#1e3a5f)"></div>
          </div>
        </label>
        <button class="btn-secondary full-width" id="bg-reset">Reset ke Default</button>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn-secondary" id="bg-cancel">Batal</button>
          <button class="btn-primary" id="bg-apply">Terapkan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Day detail panel (click on day) -->
  <div class="day-panel hidden" id="day-panel">
    <div class="day-panel-header">
      <h3 id="day-panel-title"></h3>
      <button class="icon-btn" id="day-panel-close">✕</button>
    </div>
    <div id="day-panel-events" class="day-panel-events"></div>
    <button class="add-event-btn day-panel-add" id="day-panel-add">+ Tambah Event</button>
  </div>

  <script>
    // ===== STATE =====
    let currentDate = new Date();
    let events = [];
    let currentEventId = null;
    let editingDate = null;

    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const DAYS = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    // ===== DOM REFS =====
    const grid = document.getElementById('calendar-grid');
    const monthTitle = document.getElementById('month-title');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnToday = document.getElementById('btn-today');
    const btnAdd = document.getElementById('btn-add');
    const btnNotif = document.getElementById('btn-notif');
    const btnBg = document.getElementById('btn-bg');
    const todayStrip = document.getElementById('today-strip');
    const todayEventsList = document.getElementById('today-events-list');

    const eventModal = document.getElementById('event-modal');
    const modalTitle = document.getElementById('modal-title');
    const evTitle = document.getElementById('ev-title');
    const evDate = document.getElementById('ev-date');
    const evType = document.getElementById('ev-type');
    const evRepeat = document.getElementById('ev-repeat');
    const evNotes = document.getElementById('ev-notes');
    const btnSave = document.getElementById('btn-save');
    const btnCancel = document.getElementById('btn-cancel');
    const btnDelete = document.getElementById('btn-delete');
    const modalClose = document.getElementById('modal-close');

    const bgModal = document.getElementById('bg-modal');
    const bgFile = document.getElementById('bg-file');
    const bgUrl = document.getElementById('bg-url');
    const bgApply = document.getElementById('bg-apply');
    const bgCancel = document.getElementById('bg-cancel');
    const bgReset = document.getElementById('bg-reset');
    const bgModalClose = document.getElementById('bg-modal-close');
    const gradientSwatches = document.querySelectorAll('.gradient-swatch');

    const dayPanel = document.getElementById('day-panel');
    const dayPanelTitle = document.getElementById('day-panel-title');
    const dayPanelEvents = document.getElementById('day-panel-events');
    const dayPanelClose = document.getElementById('day-panel-close');
    const dayPanelAdd = document.getElementById('day-panel-add');

    const notifBanner = document.getElementById('notif-banner');
    const notifText = document.getElementById('notif-text');
    const notifClose = document.getElementById('notif-close');

    // ===== EVENTS STORAGE =====
    function loadEvents() {
      try {
        const data = localStorage.getItem('events');
        events = data ? JSON.parse(data) : [];
      } catch { events = []; }
    }
    function saveEvents() {
      localStorage.setItem('events', JSON.stringify(events));
    }

    // ===== BACKGROUND STORAGE =====
    function loadBackground() {
      try {
        const bg = localStorage.getItem('background');
        if (bg) {
          const layer = document.getElementById('bg-layer');
          if (bg.startsWith('linear-gradient') || bg.startsWith('url')) {
            layer.style.background = bg;
            layer.classList.add('has-image');
          } else if (bg.startsWith('http') || bg.startsWith('data:image')) {
            layer.style.backgroundImage = `url(${bg})`;
            layer.classList.add('has-image');
          }
        }
      } catch {}
    }
    function saveBackground(value) {
      localStorage.setItem('background', value);
      const layer = document.getElementById('bg-layer');
      if (value.startsWith('linear-gradient')) {
        layer.style.background = value;
        layer.classList.add('has-image');
      } else if (value.startsWith('http') || value.startsWith('data:image')) {
        layer.style.backgroundImage = `url(${value})`;
        layer.classList.add('has-image');
      }
    }

    // ===== RENDER CALENDAR =====
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const today = new Date();
      today.setHours(0,0,0,0);

      monthTitle.textContent = `${MONTHS[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      grid.innerHTML = '';

      const prevMonth = month === 0 ? 11 : month - 1;
      const prevYear = month === 0 ? year - 1 : year;
      for (let i = firstDay - 1; i >= 0; i--) {
        const day = daysInPrevMonth - i;
        const dateObj = new Date(prevYear, prevMonth, day);
        grid.appendChild(createDayCell(day, dateObj, true));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const isToday = dateObj.getTime() === today.getTime();
        grid.appendChild(createDayCell(day, dateObj, false, isToday));
      }

      const totalCells = firstDay + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      const nextMonth = month === 11 ? 0 : month + 1;
      const nextYear = month === 11 ? year + 1 : year;
      for (let day = 1; day <= remaining; day++) {
        const dateObj = new Date(nextYear, nextMonth, day);
        grid.appendChild(createDayCell(day, dateObj, true));
      }

      updateTodayStrip();
    }

    function createDayCell(dayNum, dateObj, isOtherMonth, isToday = false) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (isOtherMonth) cell.classList.add('other-month');
      if (isToday) cell.classList.add('today');

      const dayOfWeek = dateObj.getDay();
      if (dayOfWeek === 0) cell.classList.add('sunday');
      if (dayOfWeek === 6) cell.classList.add('saturday');

      const daySpan = document.createElement('span');
      daySpan.className = 'day-num';
      daySpan.textContent = dayNum;
      cell.appendChild(daySpan);

      const dateStr = dateObj.toISOString().split('T')[0];
      const dayEvents = events.filter(e => e.date === dateStr);
      const shown = dayEvents.slice(0, 3);

      if (dayEvents.length > 0) {
        const dotList = document.createElement('div');
        dotList.className = 'event-dot-list';

        shown.forEach(ev => {
          const dot = document.createElement('div');
          dot.className = `event-dot ${ev.type || 'general'}`;
          dot.textContent = ev.title;
          dotList.appendChild(dot);
        });

        if (dayEvents.length > 3) {
          const more = document.createElement('div');
          more.className = 'more-events';
          more.textContent = `+${dayEvents.length - 3} lagi`;
          dotList.appendChild(more);
        }

        cell.appendChild(dotList);
      }

      cell.dataset.date = dateStr;

      const handleClick = (e) => {
        e.stopPropagation();
        openDayPanel(dateStr);
      };
      cell.addEventListener('click', handleClick);
      cell.addEventListener('touchend', (e) => {
        e.preventDefault();
        handleClick(e);
      });

      return cell;
    }

    // ===== TODAY STRIP =====
    function updateTodayStrip() {
      const today = new Date();
      today.setHours(0,0,0,0);
      const dateStr = today.toISOString().split('T')[0];
      const dayEvents = events.filter(e => e.date === dateStr);

      if (dayEvents.length === 0) {
        todayStrip.classList.add('hidden');
        return;
      }

      todayStrip.classList.remove('hidden');
      todayEventsList.innerHTML = '';
      dayEvents.forEach(ev => {
        const chip = document.createElement('span');
        chip.className = `today-chip ${ev.type || 'general'}`;
        chip.textContent = ev.title;
        todayEventsList.appendChild(chip);
      });
    }

    // ===== DAY PANEL =====
    function openDayPanel(dateStr) {
      const date = new Date(dateStr);
      const dayName = DAYS[date.getDay()];
      const day = date.getDate();
      const month = MONTHS[date.getMonth()];
      const year = date.getFullYear();
      dayPanelTitle.textContent = `${dayName}, ${day} ${month} ${year}`;

      const dayEvents = events.filter(e => e.date === dateStr);
      dayPanelEvents.innerHTML = '';

      if (dayEvents.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'day-panel-empty';
        empty.textContent = 'Tidak ada event hari ini ✨';
        dayPanelEvents.appendChild(empty);
      } else {
        dayEvents.forEach(ev => {
          const card = document.createElement('div');
          card.className = `day-event-card ${ev.type || 'general'}`;

          const title = document.createElement('div');
          title.className = 'day-event-title';
          title.textContent = ev.title;
          card.appendChild(title);

          const meta = document.createElement('div');
          meta.className = 'day-event-meta';
          const repeatText = ev.repeat && ev.repeat !== 'none' ? `🔄 ${ev.repeat}` : '';
          meta.textContent = `📌 ${ev.type || 'general'} ${repeatText}`;
          card.appendChild(meta);

          if (ev.notes) {
            const notes = document.createElement('div');
            notes.className = 'day-event-notes';
            notes.textContent = ev.notes;
            card.appendChild(notes);
          }

          card.addEventListener('click', () => {
            editEvent(ev.id);
          });
          card.addEventListener('touchend', (e) => {
            e.preventDefault();
            editEvent(ev.id);
          });

          dayPanelEvents.appendChild(card);
        });
      }

      dayPanel.dataset.date = dateStr;
      dayPanel.classList.remove('hidden');
    }

    // ===== MODAL: ADD/EDIT =====
    function openModal(dateStr = null) {
      eventModal.classList.remove('hidden');
      if (dateStr) {
        evDate.value = dateStr;
        editingDate = dateStr;
      } else {
        const today = new Date().toISOString().split('T')[0];
        evDate.value = today;
        editingDate = today;
      }
      evTitle.focus();
    }

    function closeModal() {
      eventModal.classList.add('hidden');
      currentEventId = null;
      editingDate = null;
      evTitle.value = '';
      evType.value = 'general';
      evRepeat.value = 'none';
      evNotes.value = '';
      btnDelete.classList.add('hidden');
      modalTitle.textContent = 'Tambah Event';
    }

    function editEvent(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;
      currentEventId = id;
      evTitle.value = ev.title;
      evDate.value = ev.date;
      evType.value = ev.type || 'general';
      evRepeat.value = ev.repeat || 'none';
      evNotes.value = ev.notes || '';
      modalTitle.textContent = 'Edit Event';
      btnDelete.classList.remove('hidden');
      editingDate = ev.date;
      eventModal.classList.remove('hidden');
      evTitle.focus();
    }

    function saveEvent() {
      const title = evTitle.value.trim();
      if (!title) {
        showNotification('Masukkan judul event!', 'error');
        evTitle.focus();
        return;
      }

      const date = evDate.value;
      if (!date) {
        showNotification('Pilih tanggal!', 'error');
        return;
      }

      const type = evType.value;
      const repeat = evRepeat.value;
      const notes = evNotes.value.trim();

      if (currentEventId) {
        const idx = events.findIndex(e => e.id === currentEventId);
        if (idx !== -1) {
          events[idx] = { ...events[idx], title, date, type, repeat, notes };
        }
      } else {
        const newEvent = {
          id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
          title,
          date,
          type,
          repeat,
          notes
        };
        events.push(newEvent);
      }

      saveEvents();
      closeModal();
      renderCalendar();

      const today = new Date().toISOString().split('T')[0];
      if (date === today) {
        updateTodayStrip();
      }

      showNotification('Event tersimpan! ✅');
    }

    function deleteEvent() {
      if (!currentEventId) return;
      if (!confirm('Yakin ingin menghapus event ini?')) return;
      events = events.filter(e => e.id !== currentEventId);
      saveEvents();
      closeModal();
      renderCalendar();
      updateTodayStrip();
      showNotification('Event dihapus 🗑️');
    }

    // ===== NOTIFICATION =====
    function showNotification(msg, type = 'info') {
      notifText.textContent = msg;
      notifBanner.classList.remove('hidden');
      if (type === 'error') {
        notifBanner.style.background = '#e87a7a';
        notifBanner.style.color = '#1a0a0a';
      } else {
        notifBanner.style.background = 'var(--accent)';
        notifBanner.style.color = '#1a1400';
      }
      clearTimeout(window._notifTimer);
      window._notifTimer = setTimeout(() => {
        notifBanner.classList.add('hidden');
      }, 4000);
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        showNotification('Notifikasi tidak didukung di browser ini');
        return;
      }
      if (Notification.permission === 'granted') {
        showNotification('Notifikasi sudah diizinkan ✅');
        return;
      }
      if (Notification.permission === 'denied') {
        showNotification('Notifikasi diblokir. Izinkan di pengaturan browser.');
        return;
      }
      const result = await Notification.requestPermission();
      if (result === 'granted') {
        showNotification('Notifikasi diaktifkan! 🔔');
        checkTodayEvents();
      } else {
        showNotification('Notifikasi ditolak 😔');
      }
    }

    function checkTodayEvents() {
      const today = new Date().toISOString().split('T')[0];
      const dayEvents = events.filter(e => e.date === today);
      if (dayEvents.length > 0 && Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification('📅 Event Hari Ini!', {
            body: `${dayEvents.length} event: ${dayEvents.map(e => e.title).join(', ')}`,
            icon: '/icons/icon-192.png',
            badge: '/icons/icon-72.png',
            vibrate: [200, 100, 200],
          });
        });
      }
    }

    // ===== BACKGROUND =====
    function openBgModal() {
      bgModal.classList.remove('hidden');
      bgFile.value = '';
      bgUrl.value = '';
      gradientSwatches.forEach(s => s.classList.remove('selected'));
    }

    function closeBgModal() {
      bgModal.classList.add('hidden');
    }

    function applyBackground() {
      const file = bgFile.files[0];
      const url = bgUrl.value.trim();
      const selectedGradient = document.querySelector('.gradient-swatch.selected');

      let value = null;

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          value = e.target.result;
          saveBackground(value);
          closeBgModal();
          showNotification('Background diperbarui! 🖼️');
        };
        reader.readAsDataURL(file);
        return;
      }

      if (url) {
        value = url;
      } else if (selectedGradient) {
        value = selectedGradient.dataset.gradient;
      } else {
        showNotification('Pilih gambar, URL, atau gradien!', 'error');
        return;
      }

      saveBackground(value);
      closeBgModal();
      showNotification('Background diperbarui! 🖼️');
    }

    function resetBackground() {
      localStorage.removeItem('background');
      const layer = document.getElementById('bg-layer');
      layer.style.background = '';
      layer.style.backgroundImage = '';
      layer.classList.remove('has-image');
      closeBgModal();
      showNotification('Background direset 🔄');
    }

    // ===== NAVIGATION =====
    function goToPrevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function goToNextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    // ===== INIT =====
    function init() {
      loadEvents();
      loadBackground();
      renderCalendar();

      setTimeout(checkTodayEvents, 1000);

      btnPrev.addEventListener('click', goToPrevMonth);
      btnNext.addEventListener('click', goToNextMonth);
      btnToday.addEventListener('click', goToToday);

      btnAdd.addEventListener('click', () => openModal(null));
      btnNotif.addEventListener('click', requestNotificationPermission);
      btnBg.addEventListener('click', openBgModal);

      bgCancel.addEventListener('click', closeBgModal);
      bgModalClose.addEventListener('click', closeBgModal);
      bgApply.addEventListener('click', applyBackground);
      bgReset.addEventListener('click', resetBackground);

      gradientSwatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          gradientSwatches.forEach(s => s.classList.remove('selected'));
          swatch.classList.add('selected');
        });
      });

      btnCancel.addEventListener('click', closeModal);
      modalClose.addEventListener('click', closeModal);
      btnSave.addEventListener('click', saveEvent);
      btnDelete.addEventListener('click', deleteEvent);

      eventModal.addEventListener('click', (e) => {
        if (e.target === eventModal) closeModal();
      });
      bgModal.addEventListener('click', (e) => {
        if (e.target === bgModal) closeBgModal();
      });

      dayPanelClose.addEventListener('click', () => {
        dayPanel.classList.add('hidden');
      });
      dayPanelAdd.addEventListener('click', () => {
        const date = dayPanel.dataset.date;
        dayPanel.classList.add('hidden');
        openModal(date);
      });

      notifClose.addEventListener('click', () => {
        notifBanner.classList.add('hidden');
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!eventModal.classList.contains('hidden')) closeModal();
          if (!bgModal.classList.contains('hidden')) closeBgModal();
          if (!dayPanel.classList.contains('hidden')) dayPanel.classList.add('hidden');
        }
        if (e.key === 'ArrowLeft') goToPrevMonth();
        if (e.key === 'ArrowRight') goToNextMonth();
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ SW registered'))
        .catch(() => console.log('⚠️ SW registration failed'));
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
