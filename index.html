<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XII RPL 2" />
    <meta name="description" content="Jadwal Pelajaran XII RPL 2" />
    <title>XII RPL 2 — Jadwal</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & THEME ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #1e3a5f;
            --primary: #2c5f8a;
            --primary-light: #4a90c4;
            --primary-soft: #e8f0fe;
            --secondary: #e67e22;
            --secondary-light: #f39c12;
            --secondary-soft: #fef3e8;
            --accent: #0f9d8e;
            --accent-light: #2dc4b3;
            --accent-soft: #e6f6f4;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --surface: #ffffff;
            --surface-light: #f1f5f9;
            --text: #1e293b;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius-sm: 12px;
            --radius: 20px;
            --radius-lg: 28px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 35px -8px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(44, 95, 138, 0.03) 0%, transparent 50%), radial-gradient(circle at 90% 80%, rgba(15, 157, 142, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: var(--bg);
            transition: background 0.5s ease;
        }
        #bg-layer.has-image {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        #bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(10, 10, 20, 0.10);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            pointer-events: none;
        }

        /* ===== SPLASH ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--accent) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }
        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .splash-content {
            text-align: center;
            animation: splashScale 0.6s ease-out;
        }
        @keyframes splashScale {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .splash-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            animation: logoFloat 2s ease-in-out infinite;
            font-size: 3rem;
        }
        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .splash-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .splash-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .splash-loader {
            width: 32px;
            height: 32px;
            margin: 30px auto 0;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .app-content {
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
            z-index: 2;
        }
        .app-content.visible {
            opacity: 1;
        }

        /* ===== NOTIF BANNER ===== */
        .notif-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--secondary);
            color: #1a1400;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            animation: slideDown 0.3s ease;
            min-height: 44px;
        }
        .notif-banner.hidden {
            display: none;
        }
        .notif-banner button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px;
            min-width: 44px;
            min-height: 44px;
            color: inherit;
        }
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }
            to {
                transform: translateY(0);
            }
        }

        /* ===== HEADER ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
        }
        .header-inner {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 8px;
        }
        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .logo span {
            font-size: 0.45rem;
            font-weight: 500;
            -webkit-text-fill-color: var(--text-light);
            display: block;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .today-badge {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .icon-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-light);
            border-radius: var(--radius-sm);
            width: 38px;
            height: 38px;
            min-width: 38px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            touch-action: manipulation;
            user-select: none;
        }
        .icon-btn:active {
            transform: scale(0.92);
        }
        .icon-btn:hover {
            background: var(--primary-soft);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        /* ===== MAIN ===== */
        main {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 100px;
        }

        /* ===== LIVE CLOCK ===== */
        .live-clock {
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));
            border-radius: var(--radius-lg);
            padding: 18px 16px;
            border: 1px solid rgba(44, 95, 138, 0.1);
        }
        .clock-time {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }
        .clock-info {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 500;
        }
        .current-subject-pill {
            display: inline-block;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 16px;
            border-radius: 30px;
            box-shadow: var(--shadow-sm);
        }

        /* ===== INSTALL BANNER ===== */
        .install-banner {
            display: none;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--radius);
            padding: 12px 16px;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
        }
        .install-banner.show {
            display: flex;
        }
        .install-banner p {
            flex: 1;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }
        .install-btn {
            background: white;
            color: var(--primary);
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .install-btn:hover {
            transform: scale(1.02);
        }

        /* ===== DAY TABS ===== */
        .day-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px 0;
        }
        .day-tabs::-webkit-scrollbar {
            display: none;
        }
        .day-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 40px;
            background: var(--surface);
            color: var(--text-light);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            border: 1px solid var(--border);
        }
        .day-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-color: transparent;
            color: white;
            box-shadow: var(--shadow);
            transform: scale(1.02);
        }
        .day-tab:hover:not(.active) {
            background: var(--surface-light);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        /* ===== SCHEDULE CARD ===== */
        .schedule-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--border);
        }
        .schedule-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .schedule-day-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .schedule-day-header .day-emoji {
            font-size: 1.6rem;
        }
        .schedule-day-header .day-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        .schedule-day-header .day-date {
            margin-left: auto;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* ===== SCHEDULE ROWS ===== */
        .schedule-row {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
        }
        .schedule-row:last-child {
            border-bottom: none;
        }
        .schedule-row:hover {
            background: var(--surface-light);
        }
        .schedule-row.type-break {
            background: var(--accent-soft);
        }
        .schedule-row.type-pray {
            background: var(--secondary-soft);
        }
        .schedule-row.type-go {
            background: linear-gradient(90deg, rgba(15, 157, 142, 0.08), transparent);
        }
        .schedule-row.type-ceremony {
            background: rgba(148, 163, 184, 0.08);
        }
        .schedule-row.current-class {
            background: linear-gradient(90deg, rgba(44, 95, 138, 0.10), rgba(44, 95, 138, 0.05)) !important;
            position: relative;
        }
        .schedule-row.current-class::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 0 2px 2px 0;
        }

        .time-col {
            width: 90px;
            flex-shrink: 0;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            border-right: 1px solid var(--border);
        }
        .time-start {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .time-end {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-top: 1px;
        }

        .subject-col {
            flex: 1;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .subject-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .icon-main {
            background: var(--primary-soft);
        }
        .icon-break {
            background: var(--accent-soft);
        }
        .icon-pray {
            background: var(--secondary-soft);
        }
        .icon-go {
            background: var(--accent-soft);
        }
        .icon-ceremony {
            background: rgba(148, 163, 184, 0.2);
        }

        .subject-name {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.3;
            word-break: break-word;
        }
        .type-break .subject-name {
            color: var(--accent);
            font-weight: 600;
        }
        .type-pray .subject-name {
            color: var(--secondary);
            font-weight: 600;
        }
        .type-go .subject-name {
            color: var(--accent);
            font-weight: 700;
        }
        .type-ceremony .subject-name {
            color: var(--text-light);
            font-weight: 500;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            gap: 0;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            z-index: 200;
        }
        .nav-item {
            flex: 1;
            max-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            background: transparent;
            border: none;
        }
        .nav-item.active {
            color: var(--primary);
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            transition: transform 0.2s;
        }
        .nav-item:hover svg {
            transform: translateY(-2px);
        }

        /* ===== MODAL BACKGROUND ===== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-backdrop.hidden {
            display: none;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: #ffffff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }
        .modal-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-body label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .modal-body input {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            width: 100%;
            transition: border-color 0.2s;
        }
        .modal-body input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 20px 16px;
            border-top: 1px solid var(--border);
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            min-height: 40px;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:hover {
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            min-height: 40px;
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .btn-secondary:hover {
            background: var(--border);
        }
        .btn-danger {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            min-height: 40px;
        }
        .btn-danger:active {
            transform: scale(0.96);
        }
        .btn-danger:hover {
            background: #e74c3c;
            color: white;
        }
        .btn-danger.hidden {
            display: none;
        }
        .full-width {
            width: 100%;
            margin-top: 4px;
        }

        /* ===== GRADIENT PICKER ===== */
        .gradient-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .gradient-swatch {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            min-width: 38px;
        }
        .gradient-swatch:active {
            transform: scale(0.92);
        }
        .gradient-swatch:hover,
        .gradient-swatch.selected {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .schedule-card {
            animation: fadeInUp 0.35s ease forwards;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .header-inner {
                height: 56px;
            }
            .logo {
                font-size: 1.3rem;
            }
            .logo span {
                font-size: 0.4rem;
            }
            .icon-btn {
                width: 34px;
                height: 34px;
                min-width: 34px;

        }, {

            short: 'Sab',
            schedule: [
                { time: '06.45', end: '07.15', subject: 'DuQuBa', type: 'ceremony', icon: '📖' },
                { time: '07.15', end: '08.25', subject: 'MTK (bu Siti Nurjanah)', type: 'main', icon: '📐' },

                { time: '09.35', end: '09.55', subject: 'Istirahat', type: 'break', icon: '☕' },

                { time: '12.15', end: '13.00', subject: 'Salat zuhur berjamaah & pulang', type: 'go', icon: '🏠' },
            ]
        }];

        const DAY_NAMES_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

        // ============================================================
        //  STATE
        // ============================================================
        let activeDay = 0;
        let deferredPrompt = null;
        let notifTimer = null;
        // Cache biar pill/badge nggak nulis ulang DOM kalau isinya sama (anti kedip)
        let lastPillHTML = null;
        let lastDateStr = null;
        let lastBadgeText = null;

        // ============================================================
        //  HELPERS
        // ============================================================
        function parseTime(str) {
            if (!str) return null;
            const parts = str.replace('.', ':').split(':');
            if (parts.length < 2) return null;
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            if (isNaN(h) || isNaN(m)) return null;
            return h * 60 + m;
        }

        function nowMinutes() {
            const n = new Date();
            return n.getHours() * 60 + n.getMinutes();
        }

        function getCurrentSchoolDayIndex() {
            const d = new Date().getDay();
            if (d === 0) return 5;
            return d - 1;
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderTabs() {
            const container = document.getElementById('dayTabs');
            container.innerHTML = DAYS_DATA.map((d, i) =>
                `<div class="day-tab ${i === activeDay ? 'active' : ''}" onclick="setDay(${i})">${d.emoji} ${d.short}</div>`
            ).join('');
        }

        // Bangun ulang seluruh kartu jadwal — HANYA dipanggil saat ganti hari,
        // bukan tiap detik. Ini yang sebelumnya bikin kedap-kedip.
        function renderSchedule() {
            const day = DAYS_DATA[activeDay];
            const now = nowMinutes();
            const todayIdx = getCurrentSchoolDayIndex();
            const isToday = activeDay === todayIdx;

            const rows = day.schedule.map(item => {
                const start = parseTime(item.time);
                const end = parseTime(item.end);
                const isCurrent = isToday && end !== null && start !== null && start <= now && now < end;

                let rowClass = `schedule-row type-${item.type}`;
                if (isCurrent) rowClass += ' current-class';

                const timeHTML = item.end ?
                    `<div class="time-start">${item.time}</div><div class="time-end">${item.end}</div>` :
                    `<div class="time-start">${item.time}</div>`;

                let iconClass = 'icon-main';
                if (item.type === 'break') iconClass = 'icon-break';
                else if (item.type === 'pray') iconClass = 'icon-pray';
                else if (item.type === 'go') iconClass = 'icon-go';
                else if (item.type === 'ceremony') iconClass = 'icon-ceremony';

                return `
                    <div class="${rowClass}" data-start="${start ?? ''}" data-end="${end ?? ''}">
                        <div class="time-col">${timeHTML}</div>
                        <div class="subject-col">
                            <div class="subject-icon ${iconClass}">${item.icon}</div>
                            <div class="subject-name">${item.subject}</div>
                        </div>
                    </div>
                `;
            }).join('');

            const dateInfo = isToday ? 'Hari ini' : '';
            document.getElementById('scheduleDisplay').innerHTML = `
                <div class="schedule-card">
                    <div class="schedule-day-header">
                        <span class="day-emoji">${day.emoji}</span>
                        <span class="day-name">${day.name}</span>
                        ${dateInfo ? `<span class="day-date">${dateInfo}</span>` : ''}
                    </div>
                    ${rows}
                </div>
            `;
        }

        // Update highlight "sedang berlangsung" tiap detik TANPA render ulang
        // seluruh list — cuma toggle class pada baris yang relevan.
        function updateCurrentHighlight() {
            const isToday = activeDay === getCurrentSchoolDayIndex();
            const now = nowMinutes();
            const rows = document.querySelectorAll('#scheduleDisplay .schedule-row');
            rows.forEach(row => {
                const start = parseInt(row.dataset.start, 10);
                const end = parseInt(row.dataset.end, 10);
                const isCurrent = isToday && !isNaN(start) && !isNaN(end) && start <= now && now < end;
                if (isCurrent) {
                    row.classList.add('current-class');
                } else {
                    row.classList.remove('current-class');
                }
            });
        }

        function setDay(idx) {
            activeDay = idx;
            renderTabs();
            renderSchedule();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('navSchedule').classList.add('active');
        }

        // ============================================================
        //  CLOCK & CURRENT CLASS
        // ============================================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            // textContent tiap detik itu ringan & nggak bikin kedip (bukan innerHTML)
            document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;

            const dayName = DAY_NAMES_ID[now.getDay()];
            const dateStr = `${dayName}, ${now.getDate()} ${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}`;
            if (dateStr !== lastDateStr) {
                document.getElementById('clockDate').textContent = dateStr;
                lastDateStr = dateStr;
            }
            if (dayName !== lastBadgeText) {
                document.getElementById('todayBadge').textContent = dayName;
                lastBadgeText = dayName;
            }

            const todayIdx = getCurrentSchoolDayIndex();
            const isSchoolDay = todayIdx >= 0 && todayIdx <= 4;
            const nowMin = now.getHours() * 60 + now.getMinutes();

            let currentSubj = null;
            if (isSchoolDay) {
                const todaySched = DAYS_DATA[todayIdx].schedule;
                for (const item of todaySched) {
                    const start = parseTime(item.time);
                    const end = parseTime(item.end);
                    if (end && start !== null && start <= nowMin && nowMin < end) {
                        currentSubj = item;
                        break;
                    }
                }
            }

            let pillHTML;
            if (currentSubj && isSchoolDay) {
                pillHTML = `<div class="current-subject-pill">📌 Sedang: ${currentSubj.subject}</div>`;
            } else if (isSchoolDay) {
                const lastItem = DAYS_DATA[todayIdx].schedule[DAYS_DATA[todayIdx].schedule.length - 1];
                const lastStart = parseTime(lastItem.time);
                if (lastStart && nowMin >= lastStart) {
                    pillHTML = `<div class="current-subject-pill" style="background:var(--accent);">✅ Selesai belajar!</div>`;
                } else {
                    pillHTML = `<div class="current-subject-pill" style="background:var(--text-muted);">⏳ Belum mulai</div>`;
                }
            } else {
                pillHTML = `<div class="current-subject-pill" style="background:var(--text-muted);">📅 Libur / Akhir Pekan</div>`;
            }

            // Cuma tulis ulang DOM kalau isinya benar-benar berubah
            if (pillHTML !== lastPillHTML) {
                document.getElementById('currentPill').innerHTML = pillHTML;
                lastPillHTML = pillHTML;
            }
        }

        // ============================================================
        //  NOTIFICATION
        // ============================================================
        function showNotification(msg, type = 'info') {
            const banner = document.getElementById('notif-banner');
            const text = document.getElementById('notif-text');
            text.textContent = msg;
            banner.classList.remove('hidden');
            if (type === 'error') {
                banner.style.background = '#e87a7a';
                banner.style.color = '#1a0a0a';
            } else {
                banner.style.background = 'var(--secondary)';
                banner.style.color = '#1a1400';
            }
            clearTimeout(notifTimer);
            notifTimer = setTimeout(() => {
                banner.classList.add('hidden');
            }, 4000);
        }

        async function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showNotification('Notifikasi tidak didukung di browser ini', 'error');
                return;
            }
            if (Notification.permission === 'granted') {
                showNotification('Notifikasi sudah diizinkan ✅');
                return;
            }
            if (Notification.permission === 'denied') {
                showNotification('Notifikasi diblokir. Izinkan di pengaturan browser.', 'error');
                return;
            }
            const result = await Notification.requestPermission();
            if (result === 'granted') {
                showNotification('Notifikasi diaktifkan! 🔔');
                checkTodaySchedule();
            } else {
                showNotification('Notifikasi ditolak 😔', 'error');
            }
        }

        function checkTodaySchedule() {
            const todayIdx = getCurrentSchoolDayIndex();
            if (todayIdx < 0 || todayIdx > 4) return;
            const day = DAYS_DATA[todayIdx];
            const items = day.schedule.filter(i => i.type !== 'pray' && i.type !== 'break' && i.type !== 'go' && i.type !==
                'ceremony');
            if (items.length > 0 && Notification.permission === 'granted') {
                const names = items.map(i => i.subject).join(', ');
                navigator.serviceWorker.ready.then(reg => {
                    reg.showNotification(`📚 ${day.name} — XII RPL 2`, {
                        body: `${items.length} mata pelajaran: ${names}`,
                        icon: '/icons/icon-192.png',
                        badge: '/icons/icon-72.png',
                        vibrate: [200, 100, 200],
                    });
                });
            }
        }

        // ============================================================
        //  BACKGROUND
        // ============================================================
        function loadBackground() {
            try {
                const bg = localStorage.getItem('background');
                if (bg) {
                    const layer = document.getElementById('bg-layer');
                    if (bg.startsWith('linear-gradient') || bg.startsWith('url')) {
                        layer.style.background = bg;
                        layer.classList.add('has-image');
                    } else if (bg.startsWith('http') || bg.startsWith('data:image')) {
                        layer.style.backgroundImage = `url(${bg})`;
                        layer.classList.add('has-image');
                    }
                }
            } catch (e) {}
        }

        function saveBackground(value) {
            localStorage.setItem('background', value);
            const layer = document.getElementById('bg-layer');
            if (value.startsWith('linear-gradient')) {
                layer.style.background = value;
                layer.classList.add('has-image');
            } else if (value.startsWith('http') || value.startsWith('data:image')) {
                layer.style.backgroundImage = `url(${value})`;
                layer.classList.add('has-image');
            }
        }

        function openBgModal() {
            document.getElementById('bg-modal').classList.remove('hidden');
            document.getElementById('bg-file').value = '';
            document.getElementById('bg-url').value = '';
            document.querySelectorAll('.gradient-swatch').forEach(s => s.classList.remove('selected'));
        }

        function closeBgModal() {
            document.getElementById('bg-modal').classList.add('hidden');
        }

        function applyBackground() {
            const file = document.getElementById('bg-file').files[0];
            const url = document.getElementById('bg-url').value.trim();
            const selected = document.querySelector('.gradient-swatch.selected');

            let value = null;

            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    value = e.target.result;
                    saveBackground(value);
                    closeBgModal();
                    showNotification('Background diperbarui! 🖼️');
                };
                reader.readAsDataURL(file);
                return;
            }

            if (url) {
                value = url;
            } else if (selected) {
                value = selected.dataset.gradient;
            } else {
                showNotification('Pilih gambar, URL, atau gradien!', 'error');
                return;
            }

            saveBackground(value);
            closeBgModal();
            showNotification('Background diperbarui! 🖼️');
        }

        function resetBackground() {
            localStorage.removeItem('background');
            const layer = document.getElementById('bg-layer');
            layer.style.background = '';
            layer.style.backgroundImage = '';
            layer.classList.remove('has-image');
            closeBgModal();
            showNotification('Background direset 🔄');
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (view === 'today') {
                const idx = getCurrentSchoolDayIndex();
                if (idx >= 0 && idx <= 5) {
                    setDay(idx);
                } else {
                    setDay(0);
                }
                document.getElementById('navToday').classList.add('active');
            } else {
                document.getElementById('navSchedule').classList.add('active');
            }
        }

        // ============================================================
        //  SPLASH SCREEN
        // ============================================================
        function hideSplash() {
            const splash = document.getElementById('splashScreen');
            splash.classList.add('fade-out');
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('appContent').classList.add('visible');
            }, 600);
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            const todayIdx = getCurrentSchoolDayIndex();
            activeDay = (todayIdx >= 0 && todayIdx <= 5) ? todayIdx : 0;

            loadBackground();
            renderTabs();
            renderSchedule();
            updateClock();

            // Jam tetap update tiap detik (ringan, cuma teks).
            // Jadwal TIDAK di-render ulang tiap detik lagi — cuma highlight-nya
            // yang di-toggle, jadi kartu jadwal nggak kedap-kedip.
            setInterval(() => {
                updateClock();
                updateCurrentHighlight();
            }, 1000);

            setTimeout(hideSplash, 1500);

            document.getElementById('btn-notif').addEventListener('click', requestNotificationPermission);
            document.getElementById('btn-bg').addEventListener('click', openBgModal);
            document.getElementById('bg-modal-close').addEventListener('click', closeBgModal);
            document.getElementById('bg-cancel').addEventListener('click', closeBgModal);
            document.getElementById('bg-apply').addEventListener('click', applyBackground);
            document.getElementById('bg-reset').addEventListener('click', resetBackground);

            document.getElementById('bg-modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeBgModal();
            });

            document.querySelectorAll('.gradient-swatch').forEach(sw => {
                sw.addEventListener('click', () => {
                    document.querySelectorAll('.gradient-swatch').forEach(s => s.classList.remove('selected'));
                    sw.classList.add('selected');
                });
            });

            document.getElementById('navSchedule').addEventListener('click', () => switchView('schedule'));
            document.getElementById('navToday').addEventListener('click', () => switchView('today'));

            document.getElementById('notif-close').addEventListener('click', () => {
                document.getElementById('notif-banner').classList.add('hidden');
            });

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installBanner').classList.add('show');
            });

            document.getElementById('installBtn').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    document.getElementById('installBanner').classList.remove('show');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!document.getElementById('bg-modal').classList.contains('hidden')) closeBgModal();
                }
                if (e.key === 'ArrowLeft') {
                    const prev = activeDay > 0 ? activeDay - 1 : DAYS_DATA.length - 1;
                    setDay(prev);
                    switchView('schedule');
                }
                if (e.key === 'ArrowRight') {
                    const next = activeDay < DAYS_DATA.length - 1 ? activeDay + 1 : 0;
                    setDay(next);
                    switchView('schedule');
                }
            });

            setTimeout(checkTodaySchedule, 3000);

            console.log('📚 XII RPL 2 — Jadwal siap!');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
