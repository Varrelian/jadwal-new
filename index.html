<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GiT" />
  <meta name="description" content="Jadwal Sekolah GiT" />
  <title>GiT — Jadwal Sekolah</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="logo-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* NEW MODERN THEME - FRESH & CLEAN */
    :root {
      /* Primary - Deep Indigo & Soft Blue */
      --primary-dark: #1e3a5f;
      --primary: #2c5f8a;
      --primary-light: #4a90c4;
      --primary-soft: #e8f0fe;
      
      /* Secondary - Warm Coral/Orange */
      --secondary: #e67e22;
      --secondary-light: #f39c12;
      --secondary-soft: #fef3e8;
      
      /* Accent - Teal */
      --accent: #0f9d8e;
      --accent-light: #2dc4b3;
      --accent-soft: #e6f6f4;
      
      /* Neutral */
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --surface: #ffffff;
      --surface-light: #f1f5f9;
      --text: #1e293b;
      --text-light: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      
      /* Status */
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      
      /* Effects */
      --radius-sm: 12px;
      --radius: 20px;
      --radius-lg: 28px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 30px rgba(0,0,0,0.1);
      --shadow-hover: 0 20px 35px -8px rgba(0,0,0,0.15);
    }

    body {
      font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Subtle background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 10% 20%, rgba(44,95,138,0.03) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(15,157,142,0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* SPLASH SCREEN - Modern */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--accent) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }

    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      animation: splashScale 0.6s ease-out;
    }

    @keyframes splashScale {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .splash-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      background: rgba(255,255,255,0.15);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      animation: logoFloat 2s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .splash-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .splash-subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .splash-loader {
      width: 32px;
      height: 32px;
      margin: 30px auto 0;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app-content {
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .app-content.visible {
      opacity: 1;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .logo span {
      font-size: 0.5rem;
      font-weight: 500;
      -webkit-text-fill-color: var(--text-light);
      display: block;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .today-badge {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* MAIN */
    main {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    /* LIVE CLOCK */
    .live-clock {
      text-align: center;
      margin-bottom: 28px;
      background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid rgba(44,95,138,0.1);
    }

    .clock-time {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .clock-info {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 6px;
      font-weight: 500;
    }

    .current-subject-pill {
      display: inline-block;
      margin-top: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 30px;
      box-shadow: var(--shadow-sm);
    }

    /* DAY TABS - Modern */
    .day-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      flex-shrink: 0;
      padding: 10px 20px;
      border-radius: 40px;
      background: var(--surface);
      color: var(--text-light);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .day-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-color: transparent;
      color: white;
      box-shadow: var(--shadow);
      transform: scale(1.02);
    }

    .day-tab:hover:not(.active) {
      background: var(--surface-light);
      border-color: var(--primary-light);
      color: var(--primary);
    }

    /* SCHEDULE CARD - Modern Glassmorphism */
    .schedule-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
    }

    .schedule-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .schedule-day-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .schedule-day-header .day-emoji {
      font-size: 1.8rem;
    }

    .schedule-day-header .day-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
    }

    .schedule-day-header .day-date {
      margin-left: auto;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* SCHEDULE ROWS */
    .schedule-row {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s;
    }

    .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-row:hover {
      background: var(--surface-light);
    }

    .schedule-row.type-break {
      background: var(--accent-soft);
    }

    .schedule-row.type-pray {
      background: var(--secondary-soft);
    }

    .schedule-row.type-go {
      background: linear-gradient(90deg, rgba(15,157,142,0.08), transparent);
    }

    .schedule-row.current-class {
      background: linear-gradient(90deg, rgba(44,95,138,0.1), rgba(44,95,138,0.05)) !important;
      position: relative;
    }

    .schedule-row.current-class::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 0 2px 2px 0;
    }

    .time-col {
      width: 100px;
      flex-shrink: 0;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      border-right: 1px solid var(--border);
    }

    .time-start {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .time-end {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .subject-col {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subject-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .icon-main {
      background: var(--primary-soft);
    }

    .icon-break {
      background: var(--accent-soft);
    }

    .icon-pray {
      background: var(--secondary-soft);
    }

    .icon-go {
      background: var(--accent-soft);
    }

    .subject-name {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
    }

    .subject-name.dim {
      color: var(--text-muted);
    }

    .type-break .subject-name {
      color: var(--accent);
      font-weight: 600;
    }

    .type-pray .subject-name {
      color: var(--secondary);
      font-weight: 600;
    }

    .type-go .subject-name {
      color: var(--accent);
      font-weight: 700;
    }

    /* BOTTOM NAV - Modern */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 0;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
    }

    .nav-item {
      flex: 1;
      max-width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      transition: transform 0.2s;
    }

    .nav-item:hover svg {
      transform: translateY(-2px);
    }

    /* INSTALL BANNER */
    .install-banner {
      display: none;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius);
      padding: 14px 18px;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .install-banner.show {
      display: flex;
    }

    .install-banner p {
      flex: 1;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
    }

    .install-btn {
      background: white;
      color: var(--primary);
      border: none;
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .install-btn:hover {
      transform: scale(1.02);
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .schedule-card {
      animation: fadeIn 0.35s ease forwards;
    }
  </style>
</head>

        { time: '13.00', end: '15.40', subject: 'Pem. Web & Perangkat Bergerak', type: 'main', icon: '🌐' },
        { time: '15.40', end: '16.10', subject: 'Sholat Ashar & Istirahat', type: 'pray', icon: '🕌' },
        { time: '16.10', end: null, subject: 'Go To Home 🏠', type: 'go', icon: '🏠' },
      ]
    },
    {
      name: 'Jumat', emoji: '✨', short: "Jum",
      schedule: [
        { time: '06.45', end: '07.25', subject: 'Dumuba', type: 'ceremony', icon: '📖' },
        { time: '07.30', end: '09.30', subject: 'Matematika', type: 'main', icon: '📐' },
        { time: '09.30', end: '09.50', subject: 'Istirahat', type: 'break', icon: '☕' },
        { time: '09.50', end: '10.30', subject: 'Bahasa Indonesia', type: 'main', icon: '📝' },
        { time: '10.30', end: '11.50', subject: 'Game Developer', type: 'main', icon: '🎮' },
        { time: '11.50', end: '13.00', subject: 'Sholat Dzuhur & Istirahat', type: 'pray', icon: '🕌' },
        { time: '13.00', end: '14.20', subject: 'Game Developer', type: 'main', icon: '🎮' },
        { time: '14.20', end: '15.40', subject: 'Bahasa Inggris', type: 'main', icon: '🗣️' },
        { time: '15.40', end: '16.10', subject: 'Sholat Ashar & Istirahat', type: 'pray', icon: '🕌' },
        { time: '16.10', end: null, subject: 'Go To Home 🏠', type: 'go', icon: '🏠' },
      ]
    }
  ];

  const DAY_NAMES_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

  let activeDay = 0;
  let deferredPrompt;

  function parseTime(str) {
    if (!str) return null;
    const [h, m] = str.replace('.', ':').split(':').map(Number);
    return h * 60 + m;
  }

  function nowMinutes() {
    const n = new Date();
    return n.getHours() * 60 + n.getMinutes();
  }

  function getCurrentSchoolDayIndex() {
    const d = new Date().getDay();
    if (d === 0 || d === 6) return 0;
    return d - 1;
  }

  function renderTabs() {
    const container = document.getElementById('dayTabs');
    container.innerHTML = DAYS.map((d, i) => `
      <div class="day-tab ${i === activeDay ? 'active' : ''}" onclick="setDay(${i})">
        ${d.emoji} ${d.short}
      </div>
    `).join('');
  }

  function renderSchedule() {
    const day = DAYS[activeDay];
    const now = nowMinutes();
    const todayIdx = getCurrentSchoolDayIndex();
    const isToday = activeDay === todayIdx;

    const rows = day.schedule.map(item => {
      const start = parseTime(item.time);
      const end = parseTime(item.end);
      const isCurrent = isToday && end !== null && start <= now && now < end;

      let rowClass = `schedule-row type-${item.type}`;
      if (isCurrent) rowClass += ' current-class';

      const timeHTML = item.end
        ? `<div class="time-start">${item.time}</div><div class="time-end">${item.end}</div>`
        : `<div class="time-start">${item.time}</div>`;

      const iconClass = item.type === 'break' ? 'icon-break'
        : item.type === 'pray' ? 'icon-pray'
        : item.type === 'go' ? 'icon-go'
        : 'icon-main';

      return `
        <div class="${rowClass}">
          <div class="time-col">${timeHTML}</div>
          <div class="subject-col">
            <div class="subject-icon ${iconClass}">${item.icon}</div>
            <div class="subject-name">${item.subject}</div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('scheduleDisplay').innerHTML = `
      <div class="schedule-card">
        <div class="schedule-day-header">
          <span class="day-emoji">${day.emoji}</span>
          <span class="day-name">${day.name}</span>
          ${isToday ? '<span class="day-date">Hari ini</span>' : ''}
        </div>
        ${rows}
      </div>
    `;
  }

  function setDay(idx) {
    activeDay = idx;
    renderTabs();
    renderSchedule();
  }

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;

    const dayName = DAY_NAMES_ID[now.getDay()];
    const dateStr = `${dayName}, ${now.getDate()} ${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}`;
    document.getElementById('clockDate').textContent = dateStr;
    document.getElementById('todayBadge').textContent = dayName;

    const todayIdx = getCurrentSchoolDayIndex();
    const todaySched = DAYS[todayIdx].schedule;
    const nowMin = now.getHours() * 60 + now.getMinutes();
    let currentSubj = null;
    for (const item of todaySched) {
      const start = parseTime(item.time);
      const end = parseTime(item.end);
      if (end && start <= nowMin && nowMin < end) {
        currentSubj = item;
        break;
      }
    }
    const pill = document.getElementById('currentPill');
    if (currentSubj && now.getDay() >= 1 && now.getDay() <= 5) {
      pill.innerHTML = `<div class="current-subject-pill">📌 Sedang: ${currentSubj.subject}</div>`;
    } else {
      pill.innerHTML = '';
    }
  }

  function switchView(view) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    if (view === 'today') {
      setDay(getCurrentSchoolDayIndex());
      document.querySelectorAll('.nav-item')[1].classList.add('active');
    } else {
      document.querySelectorAll('.nav-item')[0].classList.add('active');
    }
  }

  // HIDE SPLASH SCREEN
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      splash.classList.add('fade-out');
      setTimeout(() => {
        splash.style.display = 'none';
        document.getElementById('appContent').classList.add('visible');
      }, 600);
    }, 1500);
  });

  // INSTALL PROMPT
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBanner').classList.add('show');
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    }
  });

  // INIT
  activeDay = getCurrentSchoolDayIndex();
  renderTabs();
  renderSchedule();
  updateClock();
  setInterval(() => {
    updateClock();
    renderSchedule();
  }, 1000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.log);
  }
</script>
</body>
</html>
